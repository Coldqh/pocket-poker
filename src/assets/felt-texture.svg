<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1024" viewBox="0 0 768 1024">
  <defs>
    <filter id="felt" x="0" y="0" width="100%" height="100%">
      <feTurbulence baseFrequency="0.6" numOctaves="3" seed="17" stitchTiles="stitch" type="fractalNoise" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono">
        <feFuncR type="linear" slope=".21" intercept=".09"/>
        <feFuncG type="linear" slope=".26" intercept=".22"/>
        <feFuncB type="linear" slope=".23" intercept=".11"/>
        <feFuncA type="linear" slope=".28" intercept=".13"/>
      </feComponentTransfer>
    </filter>
    <pattern id="weave" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(12)">
      <path d="M0 0h8M0 4h8" stroke="#c0dcc3" stroke-width=".6" opacity=".055"/>
      <path d="M0 0v8M4 0v8" stroke="#02190e" stroke-width=".6" opacity=".12"/>
    </pattern>
  </defs>
  <rect width="768" height="1024" fill="#145338"/>
  <rect width="768" height="1024" filter="url(#felt)"/>
  <rect width="768" height="1024" fill="url(#weave)"/>
</svg>
